name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.16.0'
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets -- --include-ignored
      - run: cargo build --locked
      - run: npm ci --prefix dsh-plugin --ignore-scripts
      - run: npm run build --prefix dsh-plugin
      - if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_ENV -Value 'AAS_OPENSSL=C:/Program Files/Git/usr/bin/openssl.exe'
      - run: node --test tests/broker.test.mjs tests/plugin-router.integration.mjs

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose version
      - run: bash tests/docker-smoke.sh
